<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Memphis Mario</title>

<!-- "Add to Home Screen" support: a website can never force Safari/Chrome's
     own tab bar or URL bar to hide during normal in-tab browsing - that's a
     hard platform restriction, not something any meta tag or JS can touch.
     The only way to get a truly chrome-free, fullscreen view is for the
     player to add this page to their home screen and launch it from there;
     these tags are what make THAT launch open standalone (no browser UI at
     all) instead of just another regular Safari/Chrome tab. See README.md
     for the one-line instructions to give scavenger-hunt participants. -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Memphis Mario" />
<meta name="theme-color" content="#4a89e0" />
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png?v=31" />
<link rel="icon" href="assets/icons/favicon-32.png?v=31" />
<link rel="manifest" href="manifest.json?v=31" />

<link rel="stylesheet" href="style.css?v=31" />
</head>
<body>

  <div id="rotate-overlay" class="overlay">
    <div class="rotate-card">
      <div class="rotate-icon">📱</div>
      <p>Turn your phone sideways to play</p>
    </div>
  </div>

  <div id="start-overlay" class="overlay">
    <div class="start-card">
      <h1>MEMPHIS MARIO</h1>
      <p class="sub">a hidden-secret adventure</p>
      <p class="hint">Use the on screen controls to move, jump, and find your next clue 🔎</p>
      <button id="start-btn">🔊 Turn on sound, then tap here to start</button>
    </div>
  </div>

  <div id="game-wrap">
    <canvas id="game" width="480" height="288"></canvas>

    <div id="hud">
      <div class="hud-left">MARIO</div>
      <div id="hud-score" class="hud-num">000000</div>
      <div id="hud-coins"><canvas id="hud-coin-icon" width="16" height="16"></canvas>×<span id="hud-coin-count">00</span></div>
      <div class="hud-mid">
        <span id="hud-world">WORLD 9-0-1</span>
      </div>
      <div class="hud-right">
        <span id="hud-time">TIME</span>
        <span id="hud-time-num">400</span>
      </div>
    </div>

    <div id="lives-hud">MARIO ×<span id="hud-lives">3</span></div>

    <!-- touch controls -->
    <div id="controls">
      <div id="dpad-zone" class="touch-zone">
        <div id="dpad-stick"></div>
      </div>
      <div id="action-zone" class="touch-zone">
        <button id="btn-descend" class="ctrl-btn">DESCEND</button>
        <button id="btn-jump" class="ctrl-btn big">JUMP</button>
      </div>
    </div>
  </div>

  <div id="message-overlay" class="overlay hidden">
    <div class="message-card">
      <canvas id="message-icon" width="16" height="16" class="hidden"></canvas>
      <p id="message-text"></p>
      <button id="message-btn">CONTINUE</button>
    </div>
  </div>

  <script src="js/sprites.js?v=31"></script>
  <script src="js/audio.js?v=31"></script>
  <script src="js/input.js?v=31"></script>
  <script src="js/level.js?v=31"></script>
  <script src="js/entities.js?v=31"></script>
  <script src="js/physics.js?v=31"></script>
  <script src="js/secretRoom.js?v=31"></script>
  <script src="js/minigame.js?v=31"></script>
  <script src="js/ui.js?v=31"></script>
  <script src="js/main.js?v=31"></script>
</body>
</html>
